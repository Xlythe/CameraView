import groovy.xml.XmlSlurper

plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.21'
    id 'com.gradleup.nmcp' version '1.5.0'
    id 'io.github.takahirom.roborazzi' version '1.70.0'
}

Properties projectProperties = new Properties()
projectProperties.load(rootProject.file('gradle.properties').newDataInputStream())

Properties localProperties = new Properties()
File localPropertiesFile = project.rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

// Builds without the optional backends, for an app whose minSdk is older than the newest
// androidx.camera, Compose and media3 releases support. Set -Pcameraview.core=true to leave them
// out: the source directories and their dependencies go together, so what is left is a library
// that needs nothing newer than API 14. Below 21 it drives the legacy backend, and what that
// cannot do reports itself unsupported.
boolean coreOnly = project.hasProperty('cameraview.core')
        && project.property('cameraview.core').toString().toBoolean()

android {
    compileSdkVersion 37

    defaultConfig {
        minSdkVersion coreOnly ? 14 : 21
        targetSdkVersion 37
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = !coreOnly
    }

    if (coreOnly) {
        sourceSets.main.java.filter.exclude '**/com/xlythe/view/camera/x/**'
        sourceSets.main.java.filter.exclude '**/com/xlythe/view/camera/edit/**'
        sourceSets.main.kotlin.filter.exclude '**/com/xlythe/compose/**'
        sourceSets.main.java.filter.exclude '**/com/xlythe/view/camera/CameraXBarcodeAnalyzer.java'
        sourceSets.main.java.filter.exclude '**/com/xlythe/view/camera/CameraXSegmentationAnalyzer.java'
        sourceSets.main.java.filter.exclude '**/com/xlythe/view/camera/CameraXFrameAnalyzer.java'
        sourceSets.test.java.filter.exclude '**/com/xlythe/view/camera/x/**'
        sourceSets.test.java.filter.exclude '**/com/xlythe/view/camera/CameraXSegmentationAnalyzerTest.java'
        sourceSets.test.java.filter.exclude '**/com/xlythe/view/camera/edit/**'
        sourceSets.test.kotlin.filter.exclude '**/com/xlythe/compose/**'
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
        targetSdk 37
        if (coreOnly) {
            lintConfig = file('lint-core.xml')
        }
    }
    buildTypes {
        debug {
            enableAndroidTestCoverage = true
        }
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
    namespace = 'com.xlythe.view.camera'
    testOptions {
        targetSdk 37
        animationsDisabled = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = "2g"
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
        managedDevices {
            localDevices {
                // The oldest level worth running, chosen from the code rather than by habit: the
                // library branches on the platform version at ten different thresholds, and an
                // API 28 device is the one that takes the "older" side of the most of them - the
                // pre-29 storage path, the pre-30 and pre-31 codec keys, the pre-33 permissions,
                // the pre-34 colour space. An API 30 device takes none of the first two, so a
                // matrix of 30 and 37 leaves that code never executed.
                pixel2Api28 {
                    device = 'Pixel 2'
                    apiLevel = 28
                    systemImageSource = 'google_apis'
                    // As above: named rather than left to AGP, whose default becomes
                    // arm64-v8a in 10.0 and is x86 for an image this old.
                    testedAbi = 'x86'
                }
                pixel6Api37 {
                    device = 'Pixel 6'
                    apiLevel = 37
                    // google_apis rather than aosp, because the 16KB-page images are only
                    // published under it: asking for aosp here resolves to
                    // system-images;android-37.0;default_ps16k, which does not exist at any
                    // architecture, and the setup task fails before a test runs.
                    systemImageSource = 'google_apis'
                    pageAlignment = com.android.build.api.dsl.ManagedVirtualDevice.PageAlignment.FORCE_16KB_PAGES
                    // AGP picks the ABI itself today and will pick arm64-v8a in 10.0, which
                    // this image cannot translate, so the matrix would turn red on an
                    // upgrade that has nothing to do with the camera.
                    testedAbi = 'x86_64'
                }
            }
            groups {
                cameraMatrix {
                    targetDevices.addAll(localDevices.pixel2Api28, localDevices.pixel6Api37)
                }
            }
        }
    }
}

jacoco {
    toolVersion = '0.8.16'
}

afterEvaluate {
    def releaseComponent = components.findByName('release')
    if (releaseComponent == null) {
        logger.warn('Release software component is not available; publication tasks will remain disabled.')
        return
    }
    publishing {
        publications {
            release(MavenPublication) {
                from releaseComponent
                groupId = group = projectProperties.getProperty("bintray.groupId")
                artifactId = projectProperties.getProperty("bintray.artifact")
                version = projectProperties.getProperty("bintray.libraryVersion")

                pom {
                    name = projectProperties.getProperty("bintray.libraryName")
                    description = projectProperties.getProperty("bintray.libraryDescription")
                    url = projectProperties.getProperty("bintray.siteUrl")
                    licenses {
                        license {
                            name = projectProperties.getProperty("bintray.licenseName")
                            url = projectProperties.getProperty("bintray.licenseUrl")
                        }
                    }
                    developers {
                        developer {
                            id = projectProperties.getProperty("bintray.developerId")
                            name = projectProperties.getProperty("bintray.developerName")
                            email = projectProperties.getProperty("bintray.developerEmail")
                        }
                    }
                    scm {
                        connection = projectProperties.getProperty("bintray.gitUrl")
                        developerConnection = projectProperties.getProperty("bintray.gitUrl")
                        url = projectProperties.getProperty("bintray.siteUrl")
                    }
                }
            }
        }
    }
}

nmcp {
    publishAllPublicationsToCentralPortal {
        username = localProperties.getProperty("bintray.username")
        password = localProperties.getProperty("bintray.password")
        publishingType = "AUTOMATIC"
    }
}

tasks.named("publish") {
    dependsOn("nmcpPublishAllPublicationsToCentralPortal")
}

signing {
    useInMemoryPgpKeys(
            localProperties.getProperty("signing.keyId"),
            localProperties.getProperty("signing.key"),
            localProperties.getProperty("signing.password"),
    )
    sign publishing.publications
}

// The modules declared below with a version range. A range resolves to the newest version a
// repository offers, pre-releases included, so for these this library's own builds turn
// pre-releases down. An exact version another library asks for, such as ML Kit's own beta
// dependency, is that library's choice and is left alone.
def rangedModules = [
        'androidx.legacy:legacy-support-v4',
        'androidx.core:core',
        'androidx.annotation:annotation',
        'androidx.exifinterface:exifinterface',
        'com.google.mlkit:barcode-scanning',
        'com.google.guava:guava',
        'androidx.camera:camera-core',
        'androidx.camera:camera-camera2',
        'androidx.camera:camera-lifecycle',
        'androidx.camera:camera-extensions',
        'androidx.camera:camera-video',
        'androidx.activity:activity-compose',
        'androidx.lifecycle:lifecycle-runtime-ktx',
        'androidx.media3:media3-transformer',
        'androidx.media3:media3-effect',
] as Set
configurations.configureEach {
    resolutionStrategy.componentSelection.all { selection ->
        def candidate = selection.candidate
        if ("${candidate.group}:${candidate.module}" in rangedModules
                && candidate.version ==~ /(?i).*[.-](alpha|beta|rc|dev|snapshot|eap)\d*([.-].*)?/) {
            selection.reject('a pre-release')
        }
    }
}

dependencies {
    // A floor and no ceiling, for everything this library exposes. An exact version in a
    // published library is a version the consuming app has to agree to, and an app that
    // wants a newer androidx than we happened to build against should not have to override
    // us to get it. Each floor is the latest stable release, so that is what an app gets unless
    // it asks for newer.
    api fileTree(include: ['*.jar'], dir: 'libs')
    if (coreOnly) {
        // The core build is the exception: these have a ceiling too, at releases that declare a
        // minSdk the core build supports, because a dependency's floor becomes the app's. An app
        // that wants a newer release still gets it by asking for one. verifyCoreMinSdk checks
        // these and everything they pull in.
        api 'androidx.legacy:legacy-support-v4:[1.0.0,1.1)'
        // Named for CameraFragment's registerReceiver flags, rather than left to whichever
        // version something else happens to bring.
        api 'androidx.core:core:[1.9.0,1.10)'
        // Named because the library's own sources use these annotations throughout. A plain jar
        // that sets no minSdk, so it needs no ceiling.
        api 'androidx.annotation:annotation:[1.11.0,)'
        api 'androidx.exifinterface:exifinterface:[1.3.7,1.4)'
        // ML Kit needs API 21, so the core build only compiles against it and leaves adding it to
        // the app. CameraView#enterBarcodeScanner returns false when it is missing.
        compileOnly 'com.google.mlkit:barcode-scanning:[17.3.0,)'
        testImplementation 'com.google.mlkit:barcode-scanning:[17.3.0,)'
        // The same for the segmenter, which CameraView#enterBackgroundReplacement reports
        // missing the same way.
        compileOnly 'com.google.mlkit:segmentation-selfie:[16.0.0-beta6,)'
        testImplementation 'com.google.mlkit:segmentation-selfie:[16.0.0-beta6,)'
    } else {
        api 'com.google.mlkit:barcode-scanning:[17.3.0,)'
        // A floor at its latest release like the rest, but left out of rangedModules: it has only
        // ever shipped betas, so turning pre-releases down would leave nothing to resolve.
        api 'com.google.mlkit:segmentation-selfie:[16.0.0-beta6,)'
        api 'androidx.legacy:legacy-support-v4:[1.0.0,)'
        // Below 1.5, whose releases need API 24 where this build declares 21.
        api 'androidx.exifinterface:exifinterface:[1.4.2,1.5)'
        // CameraX's futures and media3's lists are Guava types, so only this build needs it.
        api 'com.google.guava:guava:[33.8.0-android,)'
        // 1.7.0 rather than the older floor the rest keep: the slow-motion and frame-effect
        // paths call SessionConfig and CameraEffect, which arrived in it.
        api 'androidx.camera:camera-core:[1.7.0,)'
        api 'androidx.camera:camera-camera2:[1.7.0,)'
        api 'androidx.camera:camera-lifecycle:[1.7.0,)'
        api 'androidx.camera:camera-extensions:[1.7.0,)'
        api 'androidx.camera:camera-video:[1.7.0,)'
        api 'androidx.activity:activity-compose:[1.13.0,)'
        api 'androidx.lifecycle:lifecycle-runtime-ktx:[2.11.1,)'
        api 'androidx.media3:media3-transformer:[1.11.1,)'
        api 'androidx.media3:media3-effect:[1.11.1,)'
    }
    // The test dependencies stay exact. They reach no consumer, and a suite that silently
    // changed runner underneath a failure is a worse trade than one that needs bumping.
    testImplementation 'org.robolectric:robolectric:4.18.1'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.70.0'
    testImplementation 'androidx.compose.ui:ui-test-junit4-android:1.9.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.9.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.3.21") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.21") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
}

// A dependency's minSdk becomes the app's, so one release raising its floor would quietly raise
// the core build's along with it. This fails the build instead, naming the dependency. Jars
// declare no minSdk, so only Android libraries are read.
if (coreOnly) {
    tasks.register('verifyCoreMinSdk') {
        int coreMinSdk = android.defaultConfig.minSdk
        def manifests = configurations.releaseRuntimeClasspath.incoming.artifactView {
            attributes { attribute(Attribute.of('artifactType', String), 'android-manifest') }
        }.artifacts
        group = 'verification'
        description = "Fails if a dependency of the core build needs more than API ${coreMinSdk}."
        inputs.files(manifests.artifactFiles)
        doLast {
            List<String> tooNew = []
            manifests.artifacts.each { artifact ->
                def usesSdk = new XmlSlurper(false, false).parse(artifact.file).'uses-sdk'
                String declared = usesSdk.@'android:minSdkVersion'.text()
                int minSdk = declared ? declared.toInteger() : 1
                logger.info("${artifact.id.componentIdentifier.displayName}: minSdk ${minSdk}")
                if (minSdk > coreMinSdk) {
                    tooNew << "${artifact.id.componentIdentifier.displayName} (minSdk ${minSdk})"
                }
            }
            if (!tooNew.isEmpty()) {
                throw new GradleException("The core build supports API ${coreMinSdk}, but these "
                        + "dependencies need more: ${tooNew.join(', ')}")
            }
        }
    }
}

apply from: rootProject.file('gradle/coverage.gradle')
