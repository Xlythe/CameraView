apply plugin: 'com.android.application'

// Matches the library's own flag, so one command builds the whole old-API configuration. With it
// the sample drops to 23 and leaves out the CameraX half of itself; without it it stays at 24,
// because androidx.camera's pipe backend declares a minSdk of 24 and a dependency's floor is the
// app's floor whatever the library says.
boolean coreOnly = project.hasProperty('cameraview.core')
        && project.property('cameraview.core').toString().toBoolean()

android {
    compileSdkVersion 37
    enableKotlin = false

    defaultConfig {
        applicationId "com.xlythe.sample.camera"
        // 23 for the core build, so the library's pre-24 paths, such as filing a capture with a
        // broadcast, run in an app. Not 21: the Material components this sample uses stop at 23.
        minSdkVersion coreOnly ? 23 : 24
        targetSdkVersion 37
        versionCode 1
        versionName "1.0.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
    namespace = 'com.xlythe.sample.camera'
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = "2g"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':camera-view')
    implementation 'androidx.constraintlayout:constraintlayout:+'
    implementation 'androidx.appcompat:appcompat:+'
    implementation 'androidx.legacy:legacy-support-v4:+'
    implementation 'androidx.navigation:navigation-fragment:+'
    implementation 'androidx.navigation:navigation-ui:+'
    implementation 'com.google.android.material:material:+'
    implementation 'com.google.android.gms:play-services-wearable:+'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
}
