// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google {
            // Google's own artifacts, asked of Google alone. With Maven Central first, every
            // androidx and Android tools lookup went there to miss before reaching Google, and
            // a CI runner sharing an address with others is rate limited on those misses: a 429
            // fails the build over an artifact Maven Central does not even have.
            content {
                includeGroupByRegex 'androidx\\..*'
                includeGroupByRegex 'com\\.android(\\..*)?'
                includeGroupByRegex 'com\\.google(\\..*)?'
            }
        }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google {
            // Google's own artifacts, asked of Google alone. With Maven Central first, every
            // androidx and Android tools lookup went there to miss before reaching Google, and
            // a CI runner sharing an address with others is rate limited on those misses: a 429
            // fails the build over an artifact Maven Central does not even have.
            content {
                includeGroupByRegex 'androidx\\..*'
                includeGroupByRegex 'com\\.android(\\..*)?'
                includeGroupByRegex 'com\\.google(\\..*)?'
            }
        }
        mavenCentral()
    }

    tasks.withType(Test).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        jvmArgs(
                '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
        )
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat = 'full'
        }
    }
}
